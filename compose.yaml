name: brotito
services:
  database-test:
    image: postgres:17-alpine
    profiles: [database-test]
    network_mode: none
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./supabase:/sql:ro
  web:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - brotito
volumes:
  node_modules:
networks:
  brotito:
